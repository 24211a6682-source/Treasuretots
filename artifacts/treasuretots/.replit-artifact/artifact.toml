kind = "web"
previewPath = "/"
title = "TreasureTots Creations"
version = "1.0.0"
id = "artifacts/treasuretots"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20494

[services.development]
run = "pnpm --filter @workspace/treasuretots run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/treasuretots", "run", "build" ]
publicDir = "artifacts/treasuretots/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20494"
BASE_PATH = "/"
